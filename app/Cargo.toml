[package]
name = "archeion"
description = "Archeion: incremental, encrypted, scheduled backups for Windows."
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "archeion"
path = "src/main.rs"

[dependencies]
archeion_core = { workspace = true }
archeion_engine = { workspace = true }
archeion_scheduler = { workspace = true }

anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
directories = "6"
jiff = { workspace = true }
keyring = "4"
eframe = "0.37"
fluent-templates = "0.15"
rfd = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Notification-area icon and its menu.
tray-icon = { version = "0.26", default-features = false }
# Start with Windows (HKCU Run key).
winreg = "0.56"

[dev-dependencies]
# Drives the egui screens in tests, without a window.
egui_kittest = "0.37"
# The system fonts eframe draws with (icons, Hindi, Japanese, Chinese).
egui_system_font_provider = "0.37"
tempfile = { workspace = true }

[lints]
workspace = true
