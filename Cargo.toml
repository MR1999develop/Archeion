[workspace]
resolver = "3"
members = ["crates/core", "crates/engine", "crates/scheduler", "crates/win", "app"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
authors = ["MR"]
repository = "https://github.com/MR1999develop/Archeion"

[workspace.dependencies]
archeion_core = { path = "crates/core" }
archeion_engine = { path = "crates/engine" }
archeion_scheduler = { path = "crates/scheduler" }
archeion_win = { path = "crates/win" }

anyhow = "1"
# Property tests of the readers of files from outside (dev only).
proptest = { version = "1", default-features = false, features = ["std"] }
blake3 = "1"
globset = "0.4"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "warn"

[profile.dev]
debug = "line-tables-only"

# Hashing and compression are slow unoptimised: keep debug builds usable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.release.package.archeion_core]
overflow-checks = true

[profile.release.package.archeion_engine]
overflow-checks = true
